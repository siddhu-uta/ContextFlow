server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  cloud:
    gateway:
      # Strip X-Forwarded-* duplicates that can appear behind proxies
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - AddResponseHeader=X-Content-Type-Options, nosniff
        - AddResponseHeader=X-Frame-Options, DENY
        - AddResponseHeader=Referrer-Policy, strict-origin-when-cross-origin
        # X-XSS-Protection is deprecated in modern browsers; CSP is the replacement.
        # HSTS should be added at the TLS termination layer (load balancer / ingress), not here.
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            # Wildcard origin cannot be used with allowCredentials: true (reflects request Origin,
            # letting any site make credentialed cross-origin requests).
            # Set CORS_ALLOWED_ORIGINS in production to your actual frontend domain(s).
            allowedOriginPatterns: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}"
            allowedMethods: "GET,POST,PUT,DELETE,OPTIONS"
            allowedHeaders: "Authorization,Content-Type,Accept"
            allowCredentials: true
      routes:

        # ── Auth Service (public) ──────────────────────────────────────────────
        # register / login / refresh bypass JWT filter (whitelisted in JwtGlobalFilter)
        # Rate-limited per IP so credential stuffing is bounded
        - id: auth-public
          uri: ${gateway.auth-service-url}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenish-rate: 10
                redis-rate-limiter.burst-capacity: 30
                key-resolver: "#{@ipKeyResolver}"

        # ── Tenant Management (authenticated, ADMIN-only enforced by auth-service) ──
        - id: tenant-management
          uri: ${gateway.auth-service-url}
          predicates:
            - Path=/api/v1/tenants/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenish-rate: 17
                redis-rate-limiter.burst-capacity: 100
                key-resolver: "#{@tenantKeyResolver}"

        # ── Ingestion Service ─────────────────────────────────────────────────
        # File uploads can be large; higher burst allowed
        - id: ingestion
          uri: ${gateway.ingestion-service-url}
          predicates:
            - Path=/api/v1/documents/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenish-rate: 17
                redis-rate-limiter.burst-capacity: 100
                key-resolver: "#{@tenantKeyResolver}"

        # ── Query Service ─────────────────────────────────────────────────────
        # LLM calls are expensive — tighter rate limit per tenant
        - id: query
          uri: ${gateway.query-service-url}
          predicates:
            - Path=/api/v1/query
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenish-rate: 2
                redis-rate-limiter.burst-capacity: 10
                key-resolver: "#{@tenantKeyResolver}"

gateway:
  jwt-secret: ${JWT_SECRET:contextflow-dev-secret-key-must-be-at-least-32-chars-long!!}
  auth-service-url: http://localhost:8081
  ingestion-service-url: http://localhost:8082
  query-service-url: http://localhost:8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.contextflow: DEBUG
