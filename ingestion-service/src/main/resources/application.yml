server:
  port: 8082

spring:
  application:
    name: ingestion-service
  datasource:
    url: jdbc:postgresql://localhost:5432/contextflow?currentSchema=ingestion
    username: ${DB_USERNAME:contextflow}
    password: ${DB_PASSWORD:contextflow}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ingestion
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    enabled: true
    schemas: ingestion
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9092
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

ingestion:
  s3:
    endpoint: http://localhost:4566
    bucket: contextflow-documents
    region: us-east-1
    access-key: ${INGESTION_S3_ACCESS_KEY:test}
    secret-key: ${INGESTION_S3_SECRET_KEY:test}
  jwt:
    secret: ${JWT_SECRET:contextflow-dev-secret-key-must-be-at-least-32-chars-long!!}
    issuer: contextflow
  kafka:
    document-uploaded: document.uploaded

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    com.contextflow: DEBUG
    org.springframework.kafka: INFO
