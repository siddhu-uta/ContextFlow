server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all unknown paths return index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the API gateway.
    # SSE streaming requires buffering disabled and a longer read timeout.
    location /api/ {
        proxy_pass http://api-gateway:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Critical for SSE: disable buffering so tokens reach the browser immediately
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        chunked_transfer_encoding on;
        proxy_set_header X-Accel-Buffering no;
    }
}
