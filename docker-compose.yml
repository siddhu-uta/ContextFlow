version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: contextflow-postgres
    environment:
      POSTGRES_DB: contextflow
      POSTGRES_USER: ${DB_USERNAME:-contextflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-contextflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-contextflow} -d contextflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: contextflow-redis
    ports:
      - "6379:6379"
    # Set REDIS_PASSWORD to enable auth. Empty = no auth (fine for local dev).
    command: >-
      sh -c "redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: contextflow-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Two listeners: EXTERNAL for host access, INTERNAL for container-to-container
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # KRaft requires an explicit cluster ID (base64-encoded UUID)
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  localstack:
    image: localstack/localstack:3.4
    container_name: contextflow-localstack
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Observability Stack ───────────────────────────────────────────────────
  # Always-on — no profile needed. Start the full infra with just:
  #   docker compose up -d

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: contextflow-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC  (Java services send traces here)
      - "4318:4318"    # OTLP HTTP  (Python worker uses this)
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686/"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: contextflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.4.3
    container_name: contextflow-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=contextflow
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application Services ─────────────────────────────────────────────────
  # Run `docker compose build embedding-worker` first (downloads ~500MB model)
  embedding-worker:
    build: ./embedding-worker
    container_name: contextflow-embedding-worker
    ports:
      - "8083:8083"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - DB_HOST=postgres
      - S3_ENDPOINT_URL=http://localstack:4566
      - OTEL_SERVICE_NAME=embedding-worker
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s  # model load can take ~30s on first run

  # ── Full-stack Java Services — build from source ──────────────────────────
  # Start with: docker compose --profile full up
  # First build: docker compose --profile full build

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: contextflow-auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/contextflow?currentSchema=auth
      - DB_USERNAME=${DB_USERNAME:-contextflow}
      - DB_PASSWORD=${DB_PASSWORD:-contextflow}
      - SPRING_DATA_REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-contextflow-dev-secret-key-must-be-at-least-32-chars-long!!}
      - OTEL_SERVICE_NAME=auth-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    profiles:
      - full

  ingestion-service:
    build:
      context: .
      dockerfile: ingestion-service/Dockerfile
    container_name: contextflow-ingestion-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/contextflow?currentSchema=ingestion
      - DB_USERNAME=${DB_USERNAME:-contextflow}
      - DB_PASSWORD=${DB_PASSWORD:-contextflow}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - INGESTION_S3_ENDPOINT=http://localstack:4566
      - INGESTION_S3_BUCKET=contextflow-documents
      - INGESTION_S3_ACCESS_KEY=${INGESTION_S3_ACCESS_KEY:-test}
      - INGESTION_S3_SECRET_KEY=${INGESTION_S3_SECRET_KEY:-test}
      - JWT_SECRET=${JWT_SECRET:-contextflow-dev-secret-key-must-be-at-least-32-chars-long!!}
      - OTEL_SERVICE_NAME=ingestion-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    profiles:
      - full

  query-service:
    build:
      context: .
      dockerfile: query-service/Dockerfile
    container_name: contextflow-query-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/contextflow
      - DB_USERNAME=${DB_USERNAME:-contextflow}
      - DB_PASSWORD=${DB_PASSWORD:-contextflow}
      - SPRING_DATA_REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9094
      - QUERY_EMBEDDING_WORKER_URL=http://embedding-worker:8083
      - JWT_SECRET=${JWT_SECRET:-contextflow-dev-secret-key-must-be-at-least-32-chars-long!!}
      - LLM_MODE=${LLM_MODE:-mock}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OTEL_SERVICE_NAME=query-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      embedding-worker:
        condition: service_healthy
    profiles:
      - full

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: contextflow-api-gateway
    ports:
      - "8090:8090"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - GATEWAY_JWT_SECRET=${JWT_SECRET:-contextflow-dev-secret-key-must-be-at-least-32-chars-long!!}
      - GATEWAY_AUTH_SERVICE_URL=http://auth-service:8081
      - GATEWAY_INGESTION_SERVICE_URL=http://ingestion-service:8082
      - GATEWAY_QUERY_SERVICE_URL=http://query-service:8084
      - OTEL_SERVICE_NAME=api-gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    profiles:
      - full

  frontend:
    build: ./frontend
    container_name: contextflow-frontend
    ports:
      - "3001:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles:
      - full

volumes:
  postgres_data:
  redis_data:
  localstack_data:
  prometheus_data:
  grafana_data:
